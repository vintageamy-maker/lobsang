# Lobsang **開發站**：f66.io，架在 GCP uni-maindb-prod（ceos-prod-2025，asia-southeast1-c）
#
# VM 位置：~/lobsang/docker-compose.yml（本檔是版控中的正本；改了要同步到 VM）
# ⚠ 這台同時是正式資料庫主機（Percona MySQL 直接裝在 Ubuntu 上，不在 Docker 裡）。
#   這裡沒有共用 edge：web 容器自己開 80/443 對外。
# ⚠ 改了環境變數一定要 `docker compose up -d`；`restart` 讀不到新的環境變數（而且不會報錯）。
services:
  api:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: lobsang-api
    restart: unless-stopped
    working_dir: /app
    command: ["dotnet", "Lobsang.dll"]
    volumes:
      - ./publish:/app
      - ./uploads:/app/uploads
    environment:
      # ⚠⚠ 必須是 Stage，才會讀 appsettings.Stage.json（也才會種示範帳號）
      - ASPNETCORE_ENVIRONMENT=Stage
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # ⚠ 值放 .env（不入版控，範本見 env.example）。資料庫在本機 MySQL（10.0.1.11）
      - "ConnectionStrings__Default=${LOBSANG_CONN}"
      - "Jwt__Key=${LOBSANG_JWT_KEY}"
      # 登入頁的「快速登入」清單。⚠ 只有開發站有；正式站的 compose 不可有這一行。
      - "DemoAccounts=${LOBSANG_DEMO_ACCOUNTS}"
      - "BookLookup__GoogleApiKey=${GOOGLE_BOOKS_API_KEY}"
      - "Line__ChannelSecret=${LINE_CHANNEL_SECRET}"
      - "Line__ChannelAccessToken=${LINE_CHANNEL_ACCESS_TOKEN}"
      - "Line__LoginChannelId=${LINE_LOGIN_CHANNEL_ID}"
      - "Line__LiffId=${LINE_LIFF_ID}"
      - Line__AdminUrl=https://f66.io/admin/
      # 機構的儲存後端種成 Local ⇒ 檔案存在 VM 的 ~/lobsang/uploads
      - Storage__Local__Root=/app/uploads
    # ⚠ api 不對外開埠：只有 web 能送 X-Forwarded-For 進來（限流靠它認來源 IP）

  web:
    image: nginx:alpine
    container_name: lobsang-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./admin-dist:/usr/share/nginx/admin:ro
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt（certbot --webroot）
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
