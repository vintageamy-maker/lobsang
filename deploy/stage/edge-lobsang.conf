# edge 的 lobsang.helwin.com.tw vhost
# VM 位置：~/meekee/deploy/edge/conf.d/10-base.conf（edge-edge-1 是全 VM 共用的入口，本檔只管本站）
# ⚠ 改完要 `sudo docker exec edge-edge-1 nginx -t && sudo docker exec edge-edge-1 nginx -s reload`
#   先 -t：語法錯了直接 reload 會讓**同一台 VM 上所有站**一起掛。
# ⚠ 第一次建站時憑證還不存在 ⇒ 先只放 80 那段、reload、跑 certbot，拿到憑證後再加 443 那段。
server {
    listen 80;
    server_name lobsang.helwin.com.tw;
    client_max_body_size 25m;

    # ACME HTTP-01 挑戰（certbot --webroot）。比 location / 更明確，優先匹配，續期時不會被轉址攔截。
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        if ($direct_plain_http) { return 301 https://$host$request_uri; }

        # ⚠ 用變數：上游容器沒起來時 edge 仍能啟動（直接寫名字，nginx 啟動時解析不到會整個起不來）
        set $base http://lobsang-proxy;
        proxy_pass $base;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lobsang.helwin.com.tw;
    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/lobsang.helwin.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lobsang.helwin.com.tw/privkey.pem;

    location / {
        set $base http://lobsang-proxy;
        proxy_pass $base;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
