# lobsang-web 站內 nginx：/ 提供 React 靜態檔，/api 轉發 API 容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # 轉向回相對路徑，避免 https 環境被導去 http

    # ⚠ 上傳大小的實際瓶頸在這一層，不在 edge。
    #    edge 設了 10m 但這裡沒設時會吃 nginx 預設 1m，**以嚴格者為準** ——
    #    手機拍的照片（3~5 MB）一張都上不去，而錯誤只是 413，看不出是哪一層擋的。
    #    這個值要與後端 FileTypeValidator.MaxBytes 對齊。
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 檔名含內容雜湊的建置產物：可長期快取。
    # 後台與主站的靜態根不同（admin 走 alias），必須分開寫，
    # 否則後台的 assets 會落到主站的 root 而 404。
    location ~* ^/admin/(assets/.+\.(?:js|css|woff2?|png|jpe?g|svg|ico))$ {
        alias /usr/share/nginx/admin/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* ^/(assets/.+\.(?:js|css|woff2?|png|jpe?g|svg|ico))$ {
        alias /usr/share/nginx/html/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 一律不快取：它指向帶雜湊的 assets，快取住會讓使用者
    # 在改版後仍停留在舊版前端（deploy 後看不到新功能的元凶）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /admin/index.html {
        alias /usr/share/nginx/admin/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 後台 SPA（ReactAdmin，vite base=/admin/）：/admin/login 等前端路由 fallback 到 admin 的 index.html
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 主站 SPA fallback：非 /api、/admin 路徑一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
